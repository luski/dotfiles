config_version = 15

[bar.default]
background_opacity = 0.5599999874830246
center = [ "active_window" ]
end = [
    "widget_2",
    "bar",
    "tray",
    "notifications",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "clock",
    "session"
]
margin_ends = 0
position = "bottom"
start = [ "control-center", "spacer_2", "workspaces", "spacer_3", "group:g1", "widget" ]
widget_spacing = 14

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

[calendar]
enabled = true
refresh_minutes = 5

    [calendar.account.personal_google]
    color = "#1A4EE8"
    name = "Private calendar"
    type = "google"

    [calendar.account.starfish_storage]
    name = "Starfish Calendar"
    type = "google"

[control_center]
width = 1000

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "screen_time"

[desktop_widgets]
