[notification]
filter_order = [ "filter", "filter-2" ]
position = "bottom_right"

    [notification.filter.filter]
    allow_permanent = false
    allowed_urgencies = [ "critical" ]
    bypass_dnd = false
    enabled = true
    match = "slack"
    play_sound = false
    save_history = false
    show_toast = false

    [notification.filter.filter-2]
    allow_permanent = false
    bypass_dnd = false
    enabled = true
    match = "kitty"
    match_content = "^claude"
    play_sound = true
    save_history = false
    show_toast = true

[plugin_settings."baizhu/paged-todo"]
panel_layer = "overlay"
panel_placement = "floating"
panel_position = "bottom_right"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 48

[plugins]
enabled = [ "h-jangra/region-recorder", "baizhu/paged-todo", "noctalia/translator", "yuuto/arch-updater" ]

[shell]
niri_overview_type_to_launch_enabled = true
screen_time_enabled = true
telemetry_enabled = true

    [shell.panel]
    open_near_click_control_center = true

[theme]
builtin = "Tokyo-Night"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "kitty", "niri", "qt" ]
    community_ids = [ "neovim", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/lgo/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/lgo/Pictures/Wallpapers/abstract/a_black_and_white_logo.png"

    [wallpaper.last]
    path = "/home/lgo/Pictures/Wallpapers/abstract/a_black_and_white_logo.png"

    [wallpaper.monitors.DP-1]
    path = "/home/lgo/Pictures/Wallpapers/abstract/a_black_and_white_logo.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/lgo/Pictures/Wallpapers/abstract/a_black_and_white_logo.png"

[widget.active_window]
max_length = 800

[widget.bar]
type = "baizhu/paged-todo:bar"

[widget.battery]
display_mode = "graphic"
hide_when_plugged = true
show_label = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
capsule = true
capsule_opacity = 0.71999999999999997
color = "primary"
font_weight = 700
scale = 1.5

[widget.cpu]
font_scale = 0.80000000000000004
label_show_units = false

[widget.network]
show_label = false

[widget.ram]
font_scale = 0.80000000000000004
label_show_units = false

[widget.spacer_2]
length = 30
type = "spacer"

[widget.spacer_3]
length = 30
type = "spacer"

[widget.tray]
capsule = true
drawer = true
pinned = [ "Slack" ]

[widget.volume]
show_label = false

[widget.widget]
type = "h-jangra/region-recorder:widget"

[widget.widget_2]
hide_on_empty = true
type = "yuuto/arch-updater:widget"